{% extends "base.html" %}

{% block content %}

<div class="mb-4">
    <h3>Create Task</h3>
    <p class="text-muted small">Define a technical task and assign it to a team member.</p>
</div>

<form method="POST" style="max-width: 500px;">

    <div class="mb-3">
        <label class="form-label fw-bold small text-secondary">Task Title</label>
        <input type="text" name="title" class="form-control" placeholder="e.g., Update database schema" required>
    </div>

    <div class="mb-4">
        <label class="form-label fw-bold small text-secondary">Assign To:</label>
        <select name="assigned_to" class="form-control">
            {% for user in users %}
                <option value="{{ user.id }}">{{ user.username }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="d-flex align-items-center gap-2">
        <button type="submit" class="btn btn-kpit-primary">Create Task</button>
        <a href="javascript:history.back()" class="btn btn-link text-muted text-decoration-none small">Cancel</a>
    </div>

</form>

{% endblock %}
