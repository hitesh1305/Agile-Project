{% extends "base.html" %}

{% block content %}

<div class="mb-4">
    <h3>Create Story</h3>
    <p class="text-muted small">Add a new user story to define specific project requirements.</p>
</div>

<form method="POST" style="max-width: 500px;">
    <div class="mb-3">
        <label class="form-label fw-bold small text-secondary">Story Title</label>
        <input type="text" name="title" class="form-control" placeholder="e.g., Implement User Authentication" required>
    </div>

    <div class="d-flex align-items-center gap-2">
        <button type="submit" class="btn btn-kpit-primary">Create Story</button>
        <a href="javascript:history.back()" class="btn btn-link text-muted text-decoration-none small">Cancel</a>
    </div>
</form>

{% endblock %}
